{{- $models := list -}}
{{- range $id, $model := .Values.models -}}
{{- if and $model.enabled ($model.syncWithHelm | default false) -}}
{{- $models = append $models (dict "id" $id "model" $model) -}}
{{- end -}}
{{- end -}}
{{- if $models }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-model-sync
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: model-sync}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ .Values.nodeName }}}
      containers:
        - name: sync
          image: {{ .Values.images.modelSync }}
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              download() {
                destination="$1"
                url="$2"
                if test -s "$destination"; then
                  echo "Already present: $destination"
                  return
                fi
                mkdir -p "$(dirname "$destination")"
                curl --fail --location --retry 8 --retry-all-errors --continue-at - \
                  --output "$destination.part" "$url"
                test -s "$destination.part"
                mv "$destination.part" "$destination"
              }
{{- range $entry := $models }}
              download "/models/{{ $entry.id }}/{{ $entry.model.file }}" \
                "https://huggingface.co/{{ $entry.model.repo }}/resolve/{{ $entry.model.revision }}/{{ $entry.model.file }}"
{{- if $entry.model.mmproj }}
              download "/models/{{ $entry.id }}/{{ $entry.model.mmproj }}" \
                "https://huggingface.co/{{ $entry.model.repo }}/resolve/{{ $entry.model.revision }}/{{ $entry.model.mmproj }}"
{{- end }}
{{- end }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - {name: models, mountPath: /models}
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: {{ .Release.Name }}-models}}
{{- end }}
