apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector: {kubernetes.io/hostname: {{ .Values.nodeName }}}
  containers:
    - name: test
      image: {{ .Values.images.test }}
      env:
        - name: INFERENCE_API_KEY
          valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: api-key}}
      command:
        - sh
        - -ec
        - |
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://inference-api:8080/v1/models)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalid' http://inference-api:8080/v1/models)" = 401
          curl -fsS -H "Authorization: Bearer $INFERENCE_API_KEY" http://inference-api:8080/v1/models | grep -q 'benchly-vision'
          curl -fsS http://embedding:80/health >/dev/null
          curl -fsS http://reranker:80/health >/dev/null
