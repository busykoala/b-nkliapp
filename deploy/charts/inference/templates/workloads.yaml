apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: llama-swap}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: llama-swap}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
        blizzard.busykoala.io/inference-gpu: dedicated
      containers:
        - name: llama-swap
          image: {{ .Values.runtime.image }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 60, periodSeconds: 10, timeoutSeconds: 5}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
          resources:
            requests: {cpu: "8", memory: 48Gi}
            limits: {cpu: "20", memory: 112Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: config, mountPath: /etc/llama-swap/config/config.yaml, subPath: config.yaml, readOnly: true}
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: {{ .Release.Name }}-models, readOnly: true}}
        - {name: config, configMap: {name: {{ .Release.Name }}-llama-swap}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: embedding}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: embedding}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ .Values.nodeName }}}
      containers:
        - name: tei
          image: {{ .Values.images.embedding }}
          imagePullPolicy: Always
          args:
            - --model
            - /models/embedding/{{ .Values.embedding.file }}
            - --host
            - 0.0.0.0
            - --port
            - "80"
            - --embedding
            - --pooling
            - last
            - --ctx-size
            - "32768"
            - --parallel
            - "1"
            - --threads
            - "4"
            - --threads-batch
            - "4"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "512"
            - --no-warmup
            - --metrics
          ports: [{name: http, containerPort: 80}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 60, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30, timeoutSeconds: 3}
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: {{ .Release.Name }}-models, readOnly: true}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reranker
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: reranker}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: reranker}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ .Values.nodeName }}}
      containers:
        - name: tei
          image: {{ .Values.images.tei }}
          imagePullPolicy: IfNotPresent
          args: [--model-id, /models/reranker, --port, "80", --max-concurrent-requests, "8", --max-batch-tokens, "8192", --auto-truncate]
          ports: [{name: http, containerPort: 80}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 60, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30, timeoutSeconds: 3}
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "4", memory: 16Gi}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: {{ .Release.Name }}-models, readOnly: true}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: nginx}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: nginx}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ .Values.nodeName }}}
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: health, containerPort: 8081}
          startupProbe: {httpGet: {path: /healthz, port: health}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 30}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: auth, mountPath: /etc/nginx/auth, readOnly: true}
      volumes:
        - {name: config, configMap: {name: {{ .Release.Name }}-nginx}}
        - {name: auth, secret: {secretName: {{ .Values.existingSecret }}}}
