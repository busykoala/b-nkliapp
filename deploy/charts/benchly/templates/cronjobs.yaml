{{- $root := . -}}
{{- range $job := list
  (dict "name" "landscape" "schedule" .Values.workers.landscapeSchedule "deadline" 3300 "args" (list "refresh-landscape" "--database" "/data/benchly.sqlite" "--landscape-database" "/data/landscape.sqlite" "--limit" "10000"))
  (dict "name" "transit" "schedule" .Values.workers.transitSchedule "deadline" 1800 "args" (list "refresh-transit" "--transit-database" "/data/transit.sqlite"))
  (dict "name" "import-osm" "schedule" .Values.workers.importSchedule "deadline" 14400 "args" (list "import-osm" "--database" "/data/benchly.sqlite"))
  (dict "name" "enrich" "schedule" .Values.workers.enrichSchedule "deadline" 29700 "args" (list "enrich-batch" "--database" "/data/benchly.sqlite" "--limit" "1000" "--max-runtime-hours" "8" "--max-download-gib" "80"))
  (dict "name" "horizon" "schedule" .Values.workers.horizonSchedule "deadline" 3300 "args" (list "enrich-profile-batch" "--database" "/data/benchly.sqlite" "--limit" "1000" "--requests-per-second" "1" "--max-runtime-minutes" "45"))
  (dict "name" "commons" "schedule" .Values.workers.commonsSchedule "deadline" 7200 "args" (list "refresh-commons" "--database" "/data/benchly.sqlite" "--limit" "500"))
  (dict "name" "official-context" "schedule" .Values.workers.officialContextSchedule "deadline" 29700 "args" (list "import-official-context" "--database" "/data/benchly.sqlite" "--first-sunday-only"))
  (dict "name" "buildings" "schedule" .Values.workers.buildingsSchedule "deadline" 43200 "args" (list "import-swissbuildings3d" "--database" "/data/benchly.sqlite" "--max-cells" "3"))
  (dict "name" "weather-icon" "schedule" .Values.workers.weatherIconSchedule "deadline" 1500 "args" (list "refresh-weather" "--database" "/data/benchly.sqlite" "--icon-only"))
  (dict "name" "weather-radar" "schedule" .Values.workers.weatherRadarSchedule "deadline" 300 "args" (list "refresh-weather" "--database" "/data/benchly.sqlite" "--radar-only"))
  (dict "name" "image-discovery" "schedule" .Values.workers.imageDiscoverySchedule "deadline" 3000 "args" (list "discover-open-images" "--database" "/data/benchly.sqlite" "--max-cells" "50" "--requests-per-second" "1"))
  (dict "name" "scene-analysis" "schedule" .Values.workers.sceneAnalysisSchedule "deadline" 7500 "args" (list "analyze-scenes" "--database" "/data/benchly.sqlite" "--limit" "300" "--max-runtime-hours" "2" "--requests-per-second" "0.25"))
  (dict "name" "environment-reconcile" "schedule" .Values.workers.reconciliationSchedule "deadline" 3600 "args" (list "reconcile-environment" "--database" "/data/benchly.sqlite" "--limit" "5000" "--max-total" "1000"))
  (dict "name" "vision-benchmark" "schedule" .Values.workers.visionBenchmarkSchedule "deadline" 7500 "args" (list "benchmark-vision" "--database" "/data/benchly.sqlite" "--dataset" "/worker/evaluation/benchly-100.jsonl" "--models" "benchly-vision" "general" "--requests-per-second" "0.25"))
}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $root.Release.Name }}-{{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: {{ $root.Values.workers.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: {{ $job.deadline }}
      template:
        metadata:
          labels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: worker}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector: {kubernetes.io/hostname: {{ $root.Values.nodeName }}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: worker
              image: {{ $root.Values.images.worker }}
              imagePullPolicy: IfNotPresent
              args:
{{ toYaml $job.args | indent 16 }}
              env:
                - {name: HOME, value: /tmp}
                - {name: TMPDIR, value: /tmp}
{{- if or (eq $job.name "scene-analysis") (eq $job.name "vision-benchmark") }}
                - {name: INFERENCE_BASE_URL, value: "http://inference-api.inference.svc.cluster.local:8080"}
                - {name: BENCHLY_VISION_MODEL, value: {{ $root.Values.workers.visionModel | quote }}}
                - name: INFERENCE_API_KEY
                  valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: inference-api-key}}
{{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
{{- if eq $job.name "landscape" }}
                requests: {cpu: "500m", memory: 512Mi}
                limits: {cpu: "2", memory: 4Gi}
{{- else }}
                requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
                limits: {cpu: "8", memory: 24Gi, ephemeral-storage: {{ $root.Values.workers.temporaryStorage }}}
{{- end }}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: temporary, mountPath: /tmp}
          volumes:
            - {name: data, persistentVolumeClaim: {claimName: {{ $root.Release.Name }}-data}}
            - name: temporary
              emptyDir: {sizeLimit: {{ $root.Values.workers.temporaryStorage }}}
---
{{- end }}
