apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ .Values.nodeName }}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 3000}]
          env:
            {{- range $env, $key := dict "BENCHLY_OPERATOR_NAME" "operator-name" "BENCHLY_OPERATOR_EMAIL" "operator-email" "BENCHLY_OPERATOR_ADDRESS" "operator-address" "BENCHLY_HOSTING_COUNTRY" "hosting-country" "BENCHLY_PRIVACY_INFRASTRUCTURE" "privacy-infrastructure" "BENCHLY_PRIVACY_RETENTION" "privacy-retention" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: {{ $key }}, optional: true}
            {{- end }}
            - {name: TRANSIT_DATABASE_PATH, value: "/data/transit.sqlite"}
            - {name: LANDSCAPE_DATABASE_PATH, value: "/data/landscape.sqlite"}
            - {name: SOURCE_STATUS_DATABASE_PATH, value: "/data/source-status.sqlite"}
            - {name: PANORAMA_CACHE_DIR, value: "/data/panorama-cache-v1"}
            - {name: WALK_ROUTER_URL, value: {{ .Values.web.walkingRouterUrl | quote }}}
            - {name: BENCHLY_PHOTO_S3_ENDPOINT, value: {{ .Values.web.photoStorageUrl | quote }}}
            - {name: BENCHLY_PHOTO_BUCKET, value: {{ .Values.web.photoBucket | quote }}}
            - {name: INFERENCE_BASE_URL, value: "http://inference-api.inference.svc.cluster.local:8080"}
            - name: BENCHLY_PHOTO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.web.photoSecret }}, key: access-key}}
            - name: BENCHLY_PHOTO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.web.photoSecret }}, key: secret-key}}
            - name: INFERENCE_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: inference-api-key}}
            - {name: DATABASE_PATH, value: /data/benchly.sqlite}
            - {name: BENCHLY_SEED_DEMO, value: "false"}
            - {name: BENCHLY_AI_LABELS_ENABLED, value: {{ .Values.web.aiLabelsEnabled | quote }}}
            - {name: NEXT_PUBLIC_APP_URL, value: "https://bänkliapp.ch"}
            - name: CONTRIBUTOR_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: contributor-secret}}
            - name: RATE_LIMIT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: rate-limit-secret}}
            - name: USER_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: contributor-secret}}
            - {name: BENCH_VERIFICATION_THRESHOLD, value: {{ .Values.web.verificationThreshold | quote }}}
            - name: ADMIN_PASSWORD_HASH
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: admin-password-hash}}
            - name: ADMIN_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: admin-session-secret}}
          startupProbe: {httpGet: {path: /, port: http}, failureThreshold: 60, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 30, timeoutSeconds: 3, failureThreshold: 3}
          resources:
{{ toYaml .Values.web.resources | indent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}}
