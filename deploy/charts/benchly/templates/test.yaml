apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector: {kubernetes.io/hostname: {{ .Values.nodeName }}}
  containers:
    - name: test
      image: {{ .Values.images.test }}
      command: [sh, -ec, "curl -fsS --max-time 20 http://benchly/ >/dev/null"]
