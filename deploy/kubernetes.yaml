apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: benchly-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: benchly }
  template:
    metadata:
      labels: { app: benchly }
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: web
          image: benchly:latest
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: DATABASE_PATH, value: /data/benchly.sqlite }
            - name: CONTRIBUTOR_SECRET
              valueFrom: { secretKeyRef: { name: benchly-secrets, key: contributor-secret } }
            - name: RATE_LIMIT_SECRET
              valueFrom: { secretKeyRef: { name: benchly-secrets, key: rate-limit-secret } }
            - name: USER_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: benchly-secrets, key: contributor-secret } }
            - { name: BENCH_VERIFICATION_THRESHOLD, value: "3" }
            - name: ADMIN_PASSWORD_HASH
              valueFrom: { secretKeyRef: { name: benchly-secrets, key: admin-password-hash } }
            - name: ADMIN_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: benchly-secrets, key: admin-session-secret } }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: benchly-data }
---
apiVersion: v1
kind: Service
metadata:
  name: benchly
spec:
  selector: { app: benchly }
  ports:
    - { name: http, port: 80, targetPort: http }
