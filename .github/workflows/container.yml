name: Build and publish containers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".github/workflows/production-audit.yml"
      - ".github/workflows/vision-benchmark.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/busykoala/b-nkliapp

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  browser-checks:
    runs-on: ubuntu-latest
    container:
      # Match package-lock.json exactly: browser revisions and their system
      # libraries are already present, avoiding 16 concurrent apt/download jobs.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 4
    strategy:
      fail-fast: false
      # Start 15 broad browser jobs plus the dedicated release smoke job beside
      # the web/worker checks and two image builds.
      # The worker-container check follows worker-checks, keeping the initial 20
      # hosted jobs at capacity. WebKit's slow map/auth/walk groups get their
      # own 16-way shard; quicker groups share a runner so coverage stays full
      # without letting one equal-count shard dominate the critical path.
      matrix:
        include:
          - project: mobile-chrome
            browser: chromium
            shards: 1/5
            part: 1
          - project: mobile-chrome
            browser: chromium
            shards: 2/5
            part: 2
          - project: mobile-chrome
            browser: chromium
            shards: 3/5
            part: 3
          - project: mobile-chrome
            browser: chromium
            shards: 4/5
            part: 4
          - project: mobile-chrome
            browser: chromium
            shards: 5/5
            part: 5
          - project: mobile-safari
            browser: webkit
            shards: "1/16,2/16"
            part: 1
          - project: mobile-safari
            browser: webkit
            shards: "3/16,4/16"
            part: 2
          - project: mobile-safari
            browser: webkit
            shards: "5/16,6/16"
            part: 3
          - project: mobile-safari
            browser: webkit
            shards: "7/16,8/16"
            part: 4
          - project: mobile-safari
            browser: webkit
            shards: "9/16,10/16"
            part: 5
          - project: mobile-safari
            browser: webkit
            shards: 11/16
            part: 6
          - project: mobile-safari
            browser: webkit
            shards: 13/16
            part: 8
          - project: mobile-safari
            browser: webkit
            shards: 14/16
            part: 9
          - project: mobile-safari
            browser: webkit
            shards: 15/16
            part: 10
          - project: mobile-safari
            browser: webkit
            shards: 16/16
            part: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The production build is already a required web-check and container step.
      # Browser journeys use Next's local test server to avoid rebuilding the
      # identical bundle on every shard.
      - name: Test browser flows
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra shards <<< '${{ matrix.shards }}'
          for shard in "${shards[@]}"; do
            npx playwright test --project='${{ matrix.project }}' --shard="$shard"
          done
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.project }}-${{ matrix.part }}
          path: test-results
          retention-days: 7

  browser-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test release-critical mobile flows
        run: npx playwright test --project=mobile-safari --shard=12/16
      - name: Preserve smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-release-smoke
          path: test-results
          retention-days: 7

  worker-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --frozen
      - name: Test worker
        run: uv run pytest

  worker-container-check:
    # Start after the short worker suite so 16 browser jobs plus the web and
    # image builds occupy the hosted-runner allowance immediately.
    needs: worker-checks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test worker container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          target: test
          push: false
          cache-from: |
            type=gha,scope=worker-test
            type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker-test

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      matrix:
        include:
          - variant: web
            dockerfile: Dockerfile
          - variant: worker
            dockerfile: worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }},enable=${{ matrix.variant == 'web' }}
            type=ref,event=tag,enable=${{ matrix.variant == 'web' }}
            type=raw,value=worker-sha-${{ github.sha }},enable=${{ matrix.variant == 'worker' }}
            type=ref,event=tag,prefix=worker-,enable=${{ matrix.variant == 'worker' }}
          labels: |
            org.opencontainers.image.source=https://github.com/busykoala/b-nkliapp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Benchly ${{ matrix.variant }}
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Record immutable digest
        if: github.event_name != 'pull_request'
        run: echo '${{ matrix.variant }} ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

  promote-moving-tags:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Image promotion and the immutable rollout overlap the broad browser matrix
    # after a Safari smoke shard has covered statistics, filters and map listing.
    # The workflow itself remains green only when every browser shard also passes.
    needs: [containers, web-checks, browser-smoke, worker-checks, worker-container-check]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified images
        run: |
          docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$IMAGE_NAME:worker-latest" "$IMAGE_NAME:worker-sha-$GITHUB_SHA"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [containers, web-checks, browser-smoke, worker-checks, worker-container-check]
    runs-on: [self-hosted, linux, x64, benchly]
    timeout-minutes: 4
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Resolve published digests
        id: images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          registry_token="$(curl --fail --silent --show-error \
            --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository%3Abusykoala%2Fb-nkliapp%3Apull' \
            | jq -er '.token')"
          resolve_digest() {
            curl --fail --silent --show-error --head \
              --header "Authorization: Bearer $registry_token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/busykoala/b-nkliapp/manifests/$1" \
              | tr -d '\r' \
              | awk 'tolower($1) == "docker-content-digest:" { print $2; exit }'
          }
          web_digest="$(resolve_digest "sha-$GITHUB_SHA")"
          worker_digest="$(resolve_digest "worker-sha-$GITHUB_SHA")"
          test -n "$web_digest"
          test -n "$worker_digest"
          echo "web=$IMAGE_NAME@$web_digest" >> "$GITHUB_OUTPUT"
          echo "worker=$IMAGE_NAME@$worker_digest" >> "$GITHUB_OUTPUT"
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - name: Load kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
      - name: Update existing Benchly release
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostics() {
            failed_line="${1:-unknown}"
            failed_command="${2:-unknown}"
            echo "::error title=Benchly deployment failed::Line $failed_line: $failed_command"
            echo '::group::Benchly deployment diagnostics'
            helm status benchly --namespace benchly || true
            kubectl --namespace benchly get pods,jobs -o wide || true
            echo '::endgroup::'
            {
              echo '### Deployment failure'
              echo
              echo "Command at line \`$failed_line\`: \`$failed_command\`"
              echo
              echo '```text'
              helm status benchly --namespace benchly 2>&1 || true
              kubectl --namespace benchly get pods,jobs -o wide 2>&1 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          recover_pending_release() {
            release="$1"
            namespace="$2"
            status="$(helm status "$release" --namespace "$namespace" -o json | jq -r '.info.status')"
            case "$status" in
              pending-*)
                deployed_revision="$(helm history "$release" --namespace "$namespace" -o json \
                  | jq -r '[.[] | select(.status == "deployed")][-1].revision // empty')"
                test -n "$deployed_revision"
                echo "Recovering $release from $status via revision $deployed_revision"
                helm rollback "$release" "$deployed_revision" --namespace "$namespace" --wait --timeout 2m \
                  "${helm_conflict_flags[@]}"
                ;;
            esac
          }
          trap 'diagnostics "$LINENO" "$BASH_COMMAND"' ERR
          kubectl version --client
          helm_version="$(helm version --template '{{.Version}}')"
          helm_major="${helm_version#v}"
          helm_major="${helm_major%%.*}"
          helm_conflict_flags=()
          helm_safety_flags=(--atomic)
          if (( helm_major >= 4 )); then
            helm_conflict_flags=(--force-conflicts)
            helm_safety_flags=(--rollback-on-failure --force-conflicts)
          fi
          namespace_result="$(kubectl get namespace benchly -o name 2>&1)" || {
            if grep -q 'NotFound' <<<"$namespace_result"; then
              echo "Benchly is not bootstrapped yet; Ansible will perform the first install." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$namespace_result" >&2
            echo "Kubeconfig could not access the Benchly namespace." >&2
            exit 1
          }
          kubectl get deployment benchly --namespace benchly >/dev/null
          # Foot journeys must not be switched before their internal router is ready.
          kubectl --namespace routing rollout status deployment/graphhopper --timeout=30s
          helm lint "$GITHUB_WORKSPACE/deploy/charts/benchly"
          kubectl --namespace benchly create secret docker-registry benchly-ghcr \
            --docker-server=ghcr.io \
            --docker-username="$GITHUB_ACTOR" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl --namespace benchly patch serviceaccount default --type=merge \
            --patch '{"imagePullSecrets":[{"name":"benchly-ghcr"}]}'
          kubectl --namespace benchly annotate secret benchly-ghcr \
            "benchly.io/revision=$GITHUB_SHA" --overwrite
          # The shared inference stack is deployed by the server repository.
          # An application release must not reapply this repository's older mirror.
          inference_key="$(kubectl --namespace inference get secret inference-api -o jsonpath='{.data.api-key}')"
          test -n "$inference_key"
          kubectl --namespace benchly patch secret benchly-secrets --type merge \
            --patch "$(jq -cn --arg key "$inference_key" '{data:{"inference-api-key":$key}}')"
          recover_pending_release benchly benchly
          set +e
          benchly_upgrade_output="$(helm upgrade benchly "$GITHUB_WORKSPACE/deploy/charts/benchly" \
            --namespace benchly --wait --timeout 2m "${helm_safety_flags[@]}" \
            --set-string "images.web=$WEB_IMAGE" \
            --set-string "images.worker=$WORKER_IMAGE" 2>&1)"
          benchly_upgrade_status=$?
          set -e
          if (( benchly_upgrade_status != 0 )); then
            escaped_output="${benchly_upgrade_output//'%'/'%25'}"
            escaped_output="${escaped_output//$'\r'/'%0D'}"
            escaped_output="${escaped_output//$'\n'/'%0A'}"
            echo "::error title=Benchly Helm upgrade failed::$escaped_output"
            {
              echo '### Benchly Helm error'
              echo
              echo '```text'
              echo "$benchly_upgrade_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$benchly_upgrade_status"
          fi
          kubectl --namespace benchly annotate deployment/benchly \
            "benchly.io/revision=$GITHUB_SHA" --overwrite
          kubectl --namespace benchly rollout status deployment/benchly --timeout=90s
          set +e
          benchly_test_output="$(helm test benchly --namespace benchly --logs --timeout 90s 2>&1)"
          benchly_test_status=$?
          set -e
          echo "$benchly_test_output"
          if (( benchly_test_status != 0 )); then
            {
              echo '### Benchly smoke-test diagnostics'
              echo
              echo '```text'
              echo "$benchly_test_output"
              kubectl --namespace benchly get pods -o wide 2>&1 || true
              for pod in benchly-test benchly-data-test; do
                kubectl --namespace benchly logs "$pod" --all-containers --tail=200 2>&1 || true
                kubectl --namespace benchly describe pod "$pod" 2>&1 || true
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$benchly_test_status"
          fi
          bootstrap_active="$(kubectl --namespace benchly get job benchly-official-context-bootstrap \
            -o jsonpath='{.status.active}' 2>/dev/null || true)"
          osm_bootstrap=benchly-osm-geometry-v2-bootstrap
          osm_started=0
          if [[ "$bootstrap_active" != "1" ]] && ! kubectl --namespace benchly get job "$osm_bootstrap" >/dev/null 2>&1; then
            osm_args='["import-osm","--database","/data/benchly.sqlite"]'
            kubectl --namespace benchly create job --from=cronjob/benchly-import-osm "$osm_bootstrap" \
              --dry-run=client -o json \
              | jq --argjson args "$osm_args" 'del(.metadata.ownerReferences,.spec.ttlSecondsAfterFinished) | .spec.backoffLimit=1 | .spec.template.spec.containers[0].args=$args' \
              | kubectl --namespace benchly apply -f -
            osm_started=1
            echo 'Started the one-time OSM exact-geometry backfill.' >> "$GITHUB_STEP_SUMMARY"
          fi
          osm_active="$(kubectl --namespace benchly get job "$osm_bootstrap" \
            -o jsonpath='{.status.active}' 2>/dev/null || true)"
          if [[ "$osm_started" != "1" && "$osm_active" != "1" ]] && ! kubectl --namespace benchly get job benchly-official-context-bootstrap >/dev/null 2>&1; then
            bootstrap_args='["import-official-context","--database","/data/benchly.sqlite"]'
            kubectl --namespace benchly create job --from=cronjob/benchly-official-context \
              benchly-official-context-bootstrap --dry-run=client -o json \
              | jq --argjson args "$bootstrap_args" 'del(.metadata.ownerReferences,.spec.ttlSecondsAfterFinished) | .spec.backoffLimit=1 | .spec.template.spec.containers[0].args=$args' \
              | kubectl --namespace benchly apply -f -
            echo 'Started the one-time exact swissTLM context import.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Deployed $WEB_IMAGE and $WORKER_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
