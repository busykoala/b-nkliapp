name: Build and publish containers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/busykoala/b-nkliapp

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Test worker
        run: python3 -m unittest discover -s worker -p 'test_*.py'

  containers:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: web
            dockerfile: Dockerfile
          - variant: worker
            dockerfile: worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }},enable=${{ matrix.variant == 'web' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'web' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ matrix.variant == 'web' }}
            type=raw,value=worker-sha-${{ github.sha }},enable=${{ matrix.variant == 'worker' }}
            type=raw,value=worker-latest,enable=${{ matrix.variant == 'worker' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag,prefix=worker-,enable=${{ matrix.variant == 'worker' }}
          labels: |
            org.opencontainers.image.source=https://github.com/busykoala/b-nkliapp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Benchly ${{ matrix.variant }}
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Record immutable digest
        if: github.event_name != 'pull_request'
        run: echo '${{ matrix.variant }} ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: containers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve published digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          web_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" | awk '/^Digest:/{print $2; exit}')"
          worker_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:worker-sha-$GITHUB_SHA" | awk '/^Digest:/{print $2; exit}')"
          test -n "$web_digest"
          test -n "$worker_digest"
          echo "web=$IMAGE_NAME@$web_digest" >> "$GITHUB_OUTPUT"
          echo "worker=$IMAGE_NAME@$worker_digest" >> "$GITHUB_OUTPUT"
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Load kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
      - name: Update existing Benchly release
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          if ! kubectl get deployment benchly --namespace benchly >/dev/null 2>&1; then
            echo "Benchly is not bootstrapped yet; Ansible will perform the first install." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          kubectl --namespace benchly set image deployment/benchly "web=$WEB_IMAGE"
          kubectl --namespace benchly set image cronjob/benchly-import-osm "worker=$WORKER_IMAGE"
          kubectl --namespace benchly set image cronjob/benchly-enrich "worker=$WORKER_IMAGE"
          kubectl --namespace benchly set image cronjob/benchly-commons "worker=$WORKER_IMAGE"
          kubectl --namespace benchly annotate deployment/benchly \
            "benchly.io/revision=$GITHUB_SHA" --overwrite
          kubectl --namespace benchly rollout status deployment/benchly --timeout=10m
          echo "Deployed $WEB_IMAGE and $WORKER_IMAGE" >> "$GITHUB_STEP_SUMMARY"
