name: Vision benchmark

on:
  workflow_run:
    workflows: ["Build and publish containers"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: benchly-vision-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[vision benchmark]')
    runs-on: [self-hosted, linux, x64, benchly]
    environment: production
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - name: Load kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
      - name: Compare vision models on 100 reviewed locations
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          benchmark_job="benchly-vision-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          benchmark_args='["benchmark-vision","--database","/data/benchly.sqlite","--dataset","/worker/evaluation/benchly-100.jsonl","--models","benchly-vision","general","--requests-per-second","0.25","--report-only"]'
          kubectl --namespace benchly create job --from=cronjob/benchly-scene-analysis "$benchmark_job" \
            --dry-run=client -o json \
            | jq --argjson args "$benchmark_args" '.spec.backoffLimit=0 | .spec.activeDeadlineSeconds=7500 | .spec.template.spec.containers[0].args=$args' \
            | kubectl --namespace benchly apply -f -
          if ! kubectl --namespace benchly wait --for=condition=complete "job/$benchmark_job" --timeout=125m; then
            kubectl --namespace benchly logs "job/$benchmark_job" --all-containers --tail=300 || true
            kubectl --namespace benchly describe "job/$benchmark_job" || true
            exit 1
          fi
          benchmark_result="$(kubectl --namespace benchly logs "job/$benchmark_job" --all-containers | jq -c .)"
          escaped="${benchmark_result//'%'/'%25'}"
          escaped="${escaped//$'\r'/'%0D'}"
          escaped="${escaped//$'\n'/'%0A'}"
          echo "::notice title=Benchly 100-location vision benchmark::$escaped"
          kubectl --namespace benchly delete job "$benchmark_job" --wait=false
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
