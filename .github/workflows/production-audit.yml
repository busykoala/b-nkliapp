name: Production data audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and publish containers"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: benchly-production-audit
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64, benchly]
    environment: production
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - name: Load kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
      - name: Inspect import and database
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          notice() {
            title="$1"
            value="$2"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            echo "::notice title=$title::$value"
          }

          import_state="$(kubectl --namespace benchly get job benchly-official-context-bootstrap -o json \
            | jq -c '{active:(.status.active//0),succeeded:(.status.succeeded//0),failed:(.status.failed//0),conditions:(.status.conditions//[]|map({type,status,reason}))}')"
          notice "swissTLM import" "$import_state"

          panorama_state="$(kubectl --namespace benchly get deployment benchly-panorama -o json \
            | jq -c '{name:.metadata.name,desired:(.spec.replicas//0),ready:(.status.readyReplicas//0),available:(.status.availableReplicas//0),conditions:(.status.conditions//[]|map({type,status,reason,message}))}' 2>/dev/null || true)"
          panorama_log="$(kubectl --namespace benchly logs deployment/benchly-panorama --all-containers --tail=30 2>&1 || true)"
          notice "Panorama worker" "$panorama_state | $panorama_log"

          panorama_rows="$(kubectl --namespace benchly exec deployment/benchly -- node -e '
            const Database = require("better-sqlite3");
            const database = new Database("/data/benchly.sqlite", { readonly: true });
            const state = database.prepare(`SELECT
              (SELECT count(*) FROM bench_panorama_requests) requested,
              (SELECT count(*) FROM bench_panorama_geometry WHERE status=?) generating,
              (SELECT count(*) FROM bench_panorama_geometry WHERE status=?) geometry_ready,
              (SELECT count(*) FROM bench_panorama_renders WHERE status=?) renders_ready,
              (SELECT error FROM bench_panorama_geometry WHERE error IS NOT NULL ORDER BY updated_at DESC LIMIT 1) latest_error
            `).get("generating", "ready", "ready");
            console.log(JSON.stringify(state));
            database.close();
          ' 2>/dev/null || true)"
          notice "Panorama production rows" "$panorama_rows"

          requested="$(jq -r '.requested // 0' <<<"$panorama_rows" 2>/dev/null || echo 0)"
          panorama_ready="$(jq -r '.ready // 0' <<<"$panorama_state" 2>/dev/null || echo 0)"
          if (( requested > 0 && panorama_ready == 0 )); then
            kubectl --namespace benchly rollout restart deployment/benchly-panorama
            notice "Panorama recovery" "Restarted the permanent worker for the pending on-demand request."
          fi

          audit_job="benchly-production-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          audit_args='["audit-environment","--database","/data/benchly.sqlite","--require-production"]'
          kubectl --namespace benchly create job --from=cronjob/benchly-environment-reconcile "$audit_job" \
            --dry-run=client -o json \
            | jq --argjson args "$audit_args" '.spec.backoffLimit=0 | .spec.activeDeadlineSeconds=900 | .spec.template.spec.containers[0].args=$args' \
            | kubectl --namespace benchly apply -f -
          audit_state=running
          audit_deadline=$((SECONDS + 900))
          while (( SECONDS < audit_deadline )); do
            audit_state="$(kubectl --namespace benchly get "job/$audit_job" -o json \
              | jq -r 'if (.status.succeeded // 0) > 0 then "complete" elif (.status.failed // 0) > 0 then "failed" else "running" end')"
            [[ "$audit_state" != running ]] && break
            sleep 5
          done
          if [[ "$audit_state" != complete ]]; then
            kubectl --namespace benchly logs "job/$audit_job" --all-containers --tail=200 || true
            kubectl --namespace benchly describe "job/$audit_job" || true
            exit 1
          fi
          audit_result="$(kubectl --namespace benchly logs "job/$audit_job" --all-containers | jq -c .)"
          notice "Benchly production audit" "$audit_result"
          kubectl --namespace benchly delete job "$audit_job" --wait=false
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
